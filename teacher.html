<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Live Scoreboard - CyberDefender CTF</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-8">
    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-3xl font-extrabold text-amber-400">📊 Live Teacher Scoreboard</h1>
                <p class="text-slate-400 text-sm">Real-time student rankings and scores</p>
            </div>
            <div class="bg-slate-900 border border-slate-800 px-4 py-2 rounded-lg text-emerald-400 text-sm font-semibold animate-pulse">
                ● Live Sync Active
            </div>
        </header>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-xl overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-800 text-slate-400 text-xs uppercase tracking-wider">
                        <th class="py-4 px-6">Rank</th>
                        <th class="py-4 px-6">Participant Name</th>
                        <th class="py-4 px-6 text-right">Total Score</th>
                    </tr>
                </thead>
                <tbody id="scoreboard-body" class="divide-y divide-slate-800 text-slate-200">
                    <!-- Populated dynamically -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchScoreboard() {
            try {
                const res = await fetch('/api/scoreboard');
                const data = await res.json();
                
                const tbody = document.getElementById('scoreboard-body');
                tbody.innerHTML = '';

                // Convert object to array and sort by score descending
                const sortedPlayers = Object.entries(data).sort((a, b) => b[1] - a[1]);

                if (sortedPlayers.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" class="py-6 text-center text-slate-500">No participants registered yet. Waiting for flag submissions...</td></tr>`;
                    return;
                }

                sortedPlayers.forEach(([name, score], index) => {
                    const row = document.createElement('tr');
                    row.className = index === 0 ? "bg-amber-500/10 font-bold" : "hover:bg-slate-800/50";
                    row.innerHTML = `
                        <td class="py-4 px-6 text-amber-400">#${index + 1}</td>
                        <td class="py-4 px-6">${name}</td>
                        <td class="py-4 px-6 text-right text-emerald-400 font-mono text-lg">${score} pts</td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                console.error("Failed to fetch scoreboard", err);
            }
        }

        // Poll every 2 seconds
        setInterval(fetchScoreboard, 2000);
        fetchScoreboard();
    </script>
</body>
</html>
